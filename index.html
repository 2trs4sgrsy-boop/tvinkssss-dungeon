<title>TVINKSSSS — Склеп Короля-Лича</title>
<style>
:root{--bg:#0d0a12;--pan:#1a1420;--pan2:#241b2c;--gold:#e8b85a;--red:#d8434b;--grn:#52c27a;--blu:#5aa6e8;--pur:#a46be8;--txt:#efe6d8;--mut:#9a8fa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 0%,#2a1630 0%,#0d0a12 60%) fixed;color:var(--txt);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}

.sub{color:var(--mut);text-align:center;font-size:13px}
.btn{display:block;width:100%;padding:13px;margin:7px 0;border:1px solid #6b4a2a;border-radius:12px;background:linear-gradient(#3a2716,#24170d);color:var(--gold);font-weight:700;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.97)} .btn.sec{background:var(--pan2);color:var(--txt);border-color:#3a2d45} .btn:disabled{opacity:.4}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #3a2d45;background:#120e17;color:var(--txt);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cls{background:var(--pan);border:2px solid #2c2236;border-radius:12px;padding:8px 2px;text-align:center;font-size:11px;cursor:pointer}
.cls b{display:block;font-size:26px}.cls.on{border-color:var(--gold);box-shadow:0 0 12px #e8b85a55}
.card{background:var(--pan);border:1px solid #2f2439;border-radius:14px;padding:10px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
.bar{height:10px;background:#000a;border-radius:6px;overflow:hidden;position:relative}.bar>i{display:block;height:100%;background:var(--grn);transition:width .2s}
.scroll{overflow:auto;flex:1;min-height:0}
#top{display:flex;gap:6px;font-size:12px;color:var(--mut);align-items:center}
.pill{background:var(--pan2);border-radius:20px;padding:3px 9px;white-space:nowrap}
.pill.rage{color:#ff8a8a}
#enemy{position:relative;text-align:center;padding:8px 8px 10px;background:linear-gradient(#1c1022,#130d18);border:1px solid #3d2340;border-radius:16px;margin:6px 0}
#enemy .face{font-size:64px;line-height:1.1;filter:drop-shadow(0 0 14px #c03a5a)} #enemy.hit .face{animation:hit .12s}
@keyframes hit{50%{transform:scale(.92) rotate(-3deg);filter:drop-shadow(0 0 22px #fff)}}
#enemy .bar{height:16px}#enemy .bar>i{background:linear-gradient(90deg,#8a1428,#e2434b)}
.mech{border-radius:14px;padding:10px;margin:6px 0;text-align:center;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px currentColor}}
.mech.charge{background:#2a2508;color:#ffd84a;border:1px solid #ffd84a}.mech.cage{background:#1d1426;color:#c69bff;border:1px solid #a46be8}.mech.runes{background:#0d1d29;color:#7cd0ff;border:1px solid #5aa6e8}
.runes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.runes button{font-size:32px;padding:10px 0;border-radius:12px;background:#0b141c;color:#bfe6ff;border:2px solid #2b5878}
.runes button.on{border-color:#fff;background:#1d4766}
#party{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pm{background:var(--pan);border-radius:10px;padding:6px 8px;font-size:12px;border:1px solid #2c2236}.pm.me{border-color:#6b4a2a}.pm.down{opacity:.45}
.role{font-size:10px;border-radius:6px;padding:1px 5px;margin-left:4px}.r-weak{background:#5a1a22}.r-shield{background:#1a3a5a}.r-mobs{background:#3a3a12}
#tap{flex:1;min-height:120px;margin-top:8px;border-radius:50%/40%;border:2px solid #7a3b2a;background:radial-gradient(circle at 50% 40%,#5a2318,#20090a 70%);color:#ffd7a8;font:700 24px Georgia,serif;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}
#tap:active{background:radial-gradient(circle at 50% 40%,#7a3020,#2a0b0c 70%)}#tap small{font:12px system-ui;color:#d9a37a}
#tap.rattle{border-color:var(--pur);background:radial-gradient(circle,#3a2052,#120a1c 70%);color:#e2c8ff}
.fl{position:absolute;pointer-events:none;font-weight:800;color:#ffd84a;animation:fl .7s forwards;text-shadow:0 0 6px #000}@keyframes fl{to{transform:translateY(-60px);opacity:0}}
#react{display:flex;gap:6px;margin-top:6px}#react button{flex:1;padding:8px 0;border-radius:10px;border:1px solid #3a2d45;background:var(--pan2);color:var(--txt);font-size:13px}
#feed{font-size:12px;color:var(--mut);height:52px;overflow:hidden;margin-top:6px}#feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-good{color:var(--grn)}.k-bad{color:#ff8a8a}.k-mech{color:#ffd84a}.k-big{color:var(--gold);font-weight:700}.k-react{color:#7cd0ff}.k-warn{color:#ffb46a}
.opts{display:grid;gap:8px}.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--pan);border:2px solid #2f2439;cursor:pointer;font-size:17px}
.opt b{font-size:30px}.opt.on{border-color:var(--gold)}.opt .v{margin-left:auto;font-size:13px;color:var(--mut)}
.cardsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pc{background:linear-gradient(#2a1d36,#1a1220);border:2px solid #5a3d78;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;min-height:150px}
.pc b{font-size:34px;display:block}.pc .n{font-weight:700;color:#e2c8ff;margin:4px 0}.pc .d{font-size:11px;color:var(--mut)}.pc.on{border-color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:5px 4px;border-bottom:1px solid #2c2236;text-align:left}th{color:var(--mut);font-weight:500}
.it{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;margin:4px 0;background:#120e17;font-size:13px;cursor:pointer}
.rar-common{color:#bbb}.rar-uncommon{color:#6fdc8c}.rar-rare{color:#5aa6e8}.rar-epic{color:#b67cff}.rar-legendary{color:#ffa63d}.rar-mythic{color:#ff4f7b;text-shadow:0 0 8px #ff4f7b88}.rar-divine{color:#fff3a0;text-shadow:0 0 10px #ffe36a}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}#modal.on{display:flex}
#modal .box{background:var(--pan);border:1px solid #6b4a2a;border-radius:16px;padding:16px;max-width:420px;width:100%;position:relative;max-height:80vh;overflow:auto}
.x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer;padding:4px 10px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:40;pointer-events:none;text-align:center}
#toast div{background:#000c;border:1px solid #7cd0ff;color:#bfe6ff;padding:8px 16px;border-radius:20px;margin:4px;font-weight:700;font-size:18px;animation:tin 2.2s forwards}
@keyframes tin{0%{opacity:0;transform:scale(.6)}10%{opacity:1;transform:scale(1.1)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.timer{height:6px;background:#000a;border-radius:4px;overflow:hidden;margin:6px 0}.timer i{display:block;height:100%;background:var(--gold)}
.help{position:absolute;right:0;top:0;background:none;border:0;color:var(--mut);font-size:20px}

/* === Hero-tab restyle === */
#toast div{background:linear-gradient(160deg,rgba(64,26,96,.92),rgba(20,8,38,.95));border:1px solid #d9b25a;color:#ffe2a0;font-family:'Cinzel',Georgia,serif;border-radius:14px;box-shadow:0 0 18px #d9b25a55}
:root{--bg:#0d0620;--pan:rgba(42,18,80,.42);--pan2:rgba(58,28,98,.55);--gold:#d9b25a;--pur:#9b6bff;--txt:#efe8ff;--mut:#a597c4}

h1,h2{font-family:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;color:var(--gold);text-shadow:0 0 14px #d9b25a55;letter-spacing:1px}

.card,.pm,.opt,.it,#modal .box,.cls{background:linear-gradient(160deg,rgba(64,26,96,.55),rgba(30,10,42,.7));border:1px solid rgba(155,107,255,.32);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 18px #0007}
.pill{background:rgba(42,18,80,.7);border:1px solid rgba(155,107,255,.3);color:#d9d0ee;border-radius:10px}

.cls{border:2px solid #6a45b8}.cls.on{border-color:var(--gold);box-shadow:0 0 14px #d9b25a77}

#enemy{padding:0;border:1px solid rgba(217,178,90,.35);border-radius:16px;overflow:hidden;background:#0a0418;box-shadow:0 0 24px #6a3ad833,inset 0 0 0 1px rgba(155,107,255,.15)}

#react button{background:rgba(42,18,80,.6);border:1px solid rgba(155,107,255,.35);border-radius:10px}
.pm{padding:6px 8px}.pm.me{border-color:#d9b25a;box-shadow:0 0 10px #d9b25a33}.pm .bar>i{background:linear-gradient(90deg,#3aa86a,#6fdc8c)}
.opt b,.pc b{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:10px;border:2px solid #9b6bff;background:radial-gradient(circle,#3a1c62,#140828);font-size:28px;flex:none}

.pc{background:linear-gradient(160deg,rgba(64,26,96,.6),rgba(30,10,42,.8));border:1px solid rgba(155,107,255,.4)}.pc .n{color:#e9dcff}
.it{border-left:3px solid #6a45b8}.it.rar-epic{border-left-color:#9b6bff}.it.rar-legendary,.it.rar-mythic,.it.rar-divine{border-left-color:#d9b25a}

/* === v3: портреты, фоны, VFX === */
#app{position:relative;z-index:1}#bgArt{position:fixed;inset:0;z-index:0;pointer-events:none;background:#0d0620 center/cover no-repeat;transition:background-image .6s,opacity .6s;opacity:.0}
#bgArt.on{opacity:1}#bgArt:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(13,6,32,.15),rgba(13,6,32,.75) 75%),linear-gradient(rgba(13,6,32,.25),rgba(13,6,32,.8))}
.grid{grid-template-columns:repeat(5,1fr);gap:6px}
.cls{padding:0 0 5px;overflow:hidden;font-size:10.5px;letter-spacing:.3px}
.cls .pt{display:block;width:100%;aspect-ratio:1;background:center/cover;border-bottom:1px solid rgba(155,107,255,.4);filter:saturate(.75) brightness(.8)}
.cls.on .pt{filter:none}.cls.on{border-color:#d9b25a;box-shadow:0 0 16px #d9b25a88}

.ab{display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:12px;color:#ddd2f2;text-align:left}

.ab i.g{border-color:#d9b25a;background:radial-gradient(circle,#5a3a14,#1a0c06)}.ab b{color:#f0e2ff}

.pm{display:flex;gap:8px;align-items:center;padding:6px}.pm .pc2{flex:1;min-width:0}.pm.me .av{border-color:#d9b25a}
.pm.down .av{filter:grayscale(1) brightness(.5)}.pm.hurt{animation:hurt .35s}@keyframes hurt{30%{box-shadow:0 0 0 2px #ff3a4a,0 0 18px #ff3a4a}}

#party{gap:5px}
#fightRow{display:flex;gap:8px;margin-top:8px;flex:1;min-height:110px}#fightRow #tap{margin-top:0}
