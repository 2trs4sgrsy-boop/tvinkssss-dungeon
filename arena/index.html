<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TVINKSSSS — Арена 1×1</title>
<style>
:root{--bg:#0d0620;--pan:rgba(42,18,80,.55);--gold:#d9b25a;--pur:#9b6bff;--red:#d8434b;--grn:#52c27a;--txt:#efe8ff;--mut:#a597c4;
--b:clamp(46px,min(13vw,14vh),86px);--h:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:var(--h);overflow:hidden;background:var(--bg);color:var(--txt);font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;height:var(--h);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 10px;background:linear-gradient(#1b0d34,#0d0620cc);border-bottom:1px solid #d9b25a55;z-index:3}
.pl{display:flex;align-items:center;gap:7px;min-width:0}.pl.r{flex-direction:row-reverse;text-align:right}
.av{flex:none;width:clamp(30px,6vh,46px);aspect-ratio:1;border-radius:10px;border:2px solid var(--gold);background:#2a1450 center 12%/180% no-repeat;box-shadow:0 0 10px #9b6bff66}
.info{flex:1;min-width:0}.nm{font-size:clamp(11px,1.9vh,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mut);font-weight:500}
.bar{height:clamp(9px,1.7vh,14px);margin-top:3px;border-radius:7px;background:#000a;border:1px solid #d9b25a88;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7a7a,var(--red));transition:width .15s}.bar b{position:absolute;inset:0 auto 0 0;background:#fff8;transition:width .6s .25s}
.r .bar i,.r .bar b{left:auto;right:0}
.sh{height:4px;margin-top:2px;border-radius:2px;background:#5aa6e8;width:0;transition:width .2s}.r .sh{margin-left:auto}
#tm{font:800 clamp(20px,4vh,32px)/1 Georgia,serif;color:var(--gold);text-shadow:0 0 10px #d9b25a88;min-width:2.2em;text-align:center}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#joy{position:absolute;left:max(12px,2vw);bottom:max(12px,2vh);width:calc(var(--b)*2.3);height:calc(var(--b)*2.3);border-radius:50%;background:radial-gradient(#2a145088,#0d062088);border:2px solid #d9b25a66;z-index:2}

#joy span{position:absolute;color:#d9b25a99;font-size:calc(var(--b)*.22)}
#btns{position:absolute;right:max(12px,2vw);bottom:max(12px,2vh);display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(2,var(--b));gap:calc(var(--b)*.14);z-index:2}
.bt{position:relative;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 30%,#4a2690,#1a0c33);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--b)*.36);overflow:hidden;box-shadow:0 3px 0 #0008,0 0 10px #9b6bff55}
.bt small{font-size:calc(var(--b)*.14);color:var(--mut);margin-top:1px}
.bt.on{transform:scale(.92);filter:brightness(1.4)}
.bt .cd{position:absolute;inset:0;background:conic-gradient(#000b var(--p,0%),transparent 0);display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.3);color:#fff}
.bt.big{grid-row:span 2;grid-column:3;border-radius:calc(var(--b)*.5);background:radial-gradient(circle at 40% 30%,#c0444b,#4a0c1a)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0d0620cc;z-index:5}
#ov h1{margin:0;font:800 clamp(28px,7vmin,56px) Georgia,serif;color:var(--gold);text-shadow:0 0 20px #d9b25a}
#ov button{font:700 18px system-ui;padding:12px 28px;border-radius:14px;border:2px solid var(--gold);background:var(--pur);color:#fff}
#msg{position:absolute;left:0;right:0;top:18%;text-align:center;font:800 clamp(22px,6vmin,48px) Georgia,serif;color:var(--gold);text-shadow:0 0 16px #000;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
#hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap;z-index:2;pointer-events:none}
@media (hover:none){#hint{display:none}}
</style></head><body><div id="app">
<div id="hud">
 <div class="pl"><div class="av" id="av0"></div><div class="info"><div class="nm">Миша <small>· Воин</small></div><div class="bar"><b id="hb0"></b><i id="h0"></i></div><div class="sh" id="s0"></div></div></div>
 <div id="tm">99</div>
 <div class="pl r"><div class="av" id="av1"></div><div class="info"><div class="nm">Тень <small>· Ассасин · ИИ</small></div><div class="bar"><b id="hb1"></b><i id="h1"></i></div><div class="sh" id="s1"></div></div></div>
</div>
<div id="stage"><canvas id="cv"></canvas>
 <div id="hint">A/D — ход · W — прыжок · S/L — блок · J — удар · K — сильный · U/I — умения</div>
 <div id="msg"></div>
 <div id="joy"><span style="left:50%;top:4%;transform:translateX(-50%)">▲</span><span style="left:50%;bottom:4%;transform:translateX(-50%)">🛡</span><span style="left:5%;top:50%;transform:translateY(-50%)">◀</span><span style="right:5%;top:50%;transform:translateY(-50%)">▶</span><div id="knob"></div></div>
 <div id="btns">
  <div class="bt" data-k="a1">📯<small>Клич</small><div class="cd"></div></div>
  <div class="bt" data-k="a2">🔨<small>Сокруш.</small><div class="cd"></div></div>
  <div class="bt big" data-k="atk">⚔️<small>Удар</small></div>
  <div class="bt" data-k="blk">🛡️<small>Блок</small></div>
  <div class="bt" data-k="hvy">💥<small>Сильный</small><div class="cd"></div></div>
 </div>
 <div id="ov"><h1 id="res">Победа</h1><button id="again">Ещё бой</button></div>
</div></div>
<script>
'use strict';
const A='assets/',$=id=>document.getElementById(id);
$('av0').style.backgroundImage=`url(${A}warrior_m.webp)`;$('av1').style.backgroundImage=`url(${A}assassin_f.webp)`;
// fix vh for Telegram / mobile toolbars
const setH=()=>document.documentElement.style.setProperty('--h',(window.Telegram?.WebApp?.viewportStableHeight||innerHeight)+'px');addEventListener('resize',setH);setH();
const SPR={knight:{cell:180,cx:96,feet:114,body:51,anim:{idle:11,run:8,jump:3,fall:3,attack1:7,attack2:7,takehit:4,death:11}},
           samurai:{cell:200,cx:94,feet:122,body:52,anim:{idle:8,run:8,jump:2,fall:2,attack1:6,attack2:6,takehit:4,death:6}}};
const IMG={};let toLoad=0;
for(const s in SPR)for(const a in SPR[s].anim){toLoad++;const im=new Image();im.onload=()=>{if(--toLoad==0)reset()};im.src=`${A}${s}_${a}.webp`;IMG[s+a]=im}
const bg=new Image();bg.src=A+'bg.webp';
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,G=0,SC=1,DPR=1;
function resize(){const r=$('stage').getBoundingClientRect();DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;
 const portrait=H>W*0.9,ctrl=$('btns').getBoundingClientRect();G=portrait?Math.min(H*0.86,ctrl.top-r.top-10):H*0.9;
 SC=Math.max(1.2,Math.min(G*0.32,W*0.17)/52);}
addEventListener('resize',resize);
// ---------- fighters ----------
const CLS={knight:{hp:165,dmg:1.15,spd:1,armor:.2,ab:[{n:'rally',cd:12},{n:'crush',cd:15}]},samurai:{hp:130,dmg:1.25,spd:1.25,armor:0,ab:[{n:'shadow',cd:10},{n:'poison',cd:13}]}};
function mk(s,x,dir){const c=CLS[s];return{s,x,y:0,vy:0,dir,hp:c.hp,max:c.hp,st:'idle',t:0,fr:0,cd:{hvy:0,a1:0,a2:0},blk:false,shield:0,stun:0,hitT:0,kb:0,poison:0,buff:0,done:false,hitDone:false,ai:{t:0}}}
let P,E,T,over,parts=[],floats=[],shake=0,last=0,slow=0;
function reset(){resize();P=mk('knight',W*0.3,1);E=mk('samurai',W*0.7,-1);T=99;over=false;parts=[];floats=[];$('ov').style.display='none';say('БОЙ!');}
function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,900)}
const busy=f=>['attack1','attack2','takehit','death'].includes(f.st);
function setSt(f,st){if(f.st!==st){f.st=st;f.t=0;f.hitDone=false}}
function attack(f,heavy){if(busy(f)||f.stun>0||f.hp<=0)return;if(heavy){if(f.cd.hvy>0)return;f.cd.hvy=1.6}setSt(f,heavy?'attack2':'attack1');f.heavy=heavy}
function ability(f,i){const o=f===P?E:P,a=CLS[f.s].ab[i],k='a'+(i+1);if(f.cd[k]>0||f.hp<=0||f.stun>0)return;f.cd[k]=a.cd;
 if(a.n==='rally'){f.shield=35;burst(f.x,G-SC*30,'#5aa6e8',30);float(f,'Щит +35','#5aa6e8')}
 if(a.n==='crush'){setSt(f,'attack2');f.heavy=true;f.crush=true;float(f,'Сокрушающий удар!','#d9b25a')}
 if(a.n==='shadow'){burst(f.x,G-SC*25,'#9b6bff',25);f.x=Math.max(W*.05,Math.min(W*.95,o.x-o.dir*SC*30));f.dir=o.x>f.x?1:-1;burst(f.x,G-SC*25,'#9b6bff',25);f.buff=4;float(f,'Удар из тени','#9b6bff')}
 if(a.n==='poison'){setSt(f,'attack1');f.heavy=false;f.pois=true;float(f,'Яд','#52c27a')}}
function hit(a,d){const dx=d.x-a.x,rng=SC*(a.heavy?46:40);if(Math.abs(dx)>rng||Math.sign(dx)!==a.dir&&Math.abs(dx)>SC*6||Math.abs(a.y-d.y)>SC*35||d.hp<=0)return;
 let dmg=(a.heavy?13:6)*CLS[a.s].dmg*(1+Math.random()*.2),crit=a.buff>0||Math.random()<.1;if(crit)dmg*=a.buff>0?2:1.6;dmg*=1-CLS[d.s].armor;
 const front=Math.sign(a.x-d.x)===d.dir;if(d.blk&&front&&!a.crush){dmg*=.2;burst(d.x-d.dir*-SC*8,G-SC*28+d.y,'#9fd0ff',10);float(d,'Блок','#9fd0ff')}
 else{d.hitT=.18;d.kb=a.dir*SC*(a.heavy?5:2.5);if(!busy(d)||d.st==='takehit')setSt(d,'takehit');shake=a.heavy?9:4;if(a.heavy)slow=.08}
 if(d.shield>0){const s=Math.min(d.shield,dmg);d.shield-=s;dmg-=s}
 if(a.crush&&!(d.blk&&front&&false)){d.stun=1.5;float(d,'Оглушён','#d9b25a')}if(a.pois){d.poison=5}a.crush=a.pois=false;
 d.hp=Math.max(0,d.hp-dmg);slash(d,a.dir,a.heavy,crit);float(d,(crit?'КРИТ ':'')+Math.round(dmg),crit?'#ffd86b':'#fff');
 if(d.hp<=0){setSt(d,'death');end()}}
function end(){if(over)return;over=true;setTimeout(()=>{const w=P.hp>E.hp;$('res').textContent=P.hp===E.hp?'Ничья':w?'Победа!':'Поражение';$('ov').style.display='flex'},1300)}
// ---------- fx ----------
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*v*SC/3,vy:Math.sin(a)*v*SC/3,l:.5+Math.random()*.4,c,r:SC*(.6+Math.random())})}}
function slash(d,dir,heavy,crit){parts.push({sl:1,x:d.x,y:G+d.y-SC*28,dir,l:.22,L:.22,heavy,c:crit?'#ffd86b':heavy?'#ff7a7a':'#fff'});burst(d.x,G+d.y-SC*28,crit?'#ffd86b':'#ff5a5a',heavy?18:8)}
function float(f,t,c){floats.push({x:f.x,y:G+f.y-SC*58,t,c,l:1})}
// ---------- input ----------
const inp={x:0,y:0,atk:0,hvy:0,blk:0,a1:0,a2:0};const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(keys[k])return;keys[k]=1;
 ({j:'atk',k:'hvy',u:'a1',i:'a2','1':'a1','2':'a2'})[k]&&(inp[({j:'atk',k:'hvy',u:'a1',i:'a2','1':'a1','2':'a2'})[k]]=1);if(k==='w'||k===' '||k==='arrowup')inp.jump=1;if(k==='enter'&&over)reset()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joy=$('joy'),knob=$('knob');let jid=null;
function jm(e){const r=joy.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-r.left-R,dy=e.clientY-r.top-R;const m=Math.hypot(dx,dy),lim=R*.6;if(m>lim){dx*=lim/m;dy*=lim/m}
 knob.style.transform=`translate(${dx}px,${dy}px)`;const nx=dx/lim,ny=dy/lim;const py=inp.y;inp.x=Math.abs(nx)>.3?Math.sign(nx):0;inp.y=ny<-.55?-1:ny>.55?1:0;if(inp.y===-1&&py!==-1)inp.jump=1}
joy.addEventListener('pointerdown',e=>{jid=e.pointerId;joy.setPointerCapture(jid);jm(e)});joy.addEventListener('pointermove',e=>e.pointerId===jid&&jm(e));
const jup=e=>{if(e.pointerId!==jid)return;jid=null;inp.x=inp.y=0;knob.style.transform=''};joy.addEventListener('pointerup',jup);joy.addEventListener('pointercancel',jup);
document.querySelectorAll('.bt').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);b.classList.add('on');if(k==='blk')inp.blk=1;else inp[k]=1});
 const u=()=>{b.classList.remove('on');if(k==='blk')inp.blk=0};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u)});
$('again').onclick=reset;document.addEventListener('contextmenu',e=>e.preventDefault());
// ---------- AI ----------
function ai(f,o,dt){const A=f.ai;A.t-=dt;const dx=o.x-f.x,dist=Math.abs(dx);let mv=0,blk=false;
 if(o.hp<=0||f.hp<=0)return{mv:0,blk:false};
 if(busy(o)&&o.st.startsWith('attack')&&dist<SC*50&&Math.random()<.04+.0)A.blk=.5;
 if(A.blk>0){A.blk-=dt;blk=true}
 else if(dist>SC*34)mv=Math.sign(dx);else if(dist<SC*16)mv=-Math.sign(dx);
 if(A.t<=0&&dist<SC*42&&!blk){A.t=.45+Math.random()*.7;Math.random()<.3?attack(f,true):attack(f,false)}
 if(f.cd.a1<=0&&dist>SC*45&&Math.random()<.01)ability(f,0);
 if(f.cd.a2<=0&&dist<SC*40&&Math.random()<.015)ability(f,1);
 if(Math.random()<.003&&f.y===0)f.vy=-SC*10;return{mv,blk}}
// ---------- loop ----------
function upd(f,o,mv,blk,dt){const c=CLS[f.s];for(const k in f.cd)f.cd[k]=Math.max(0,f.cd[k]-dt);f.buff=Math.max(0,f.buff-dt);f.hitT=Math.max(0,f.hitT-dt);
 if(f.poison>0){f.poison-=dt;f.hp=Math.max(0,f.hp-3*dt);if(f.hp<=0&&f.st!=='death'){setSt(f,'death');end()}if(Math.random()<.2)parts.push({x:f.x+(Math.random()-.5)*SC*15,y:G+f.y-SC*20,vx:0,vy:-SC*.5,l:.6,c:'#52c27a',r:SC})}
 if(f.stun>0){f.stun-=dt;mv=0;blk=false}
 f.blk=blk&&!busy(f)&&f.y===0&&f.hp>0;
 if(f.hp>0&&!busy(f)&&!f.blk){f.x+=mv*SC*95*c.spd*dt}
 f.x+=f.kb;f.kb*=.8;f.x=Math.max(W*.05,Math.min(W*.95,f.x));
 if(f.y<0||f.vy<0){f.vy+=SC*22*dt;f.y=Math.min(0,f.y+f.vy*dt*60/4);if(f.y===0)f.vy=0}
 if(!busy(f)&&f.hp>0)f.dir=o.x>f.x?1:-1;
 const an=SPR[f.s].anim;f.t+=dt;const fps=f.st==='idle'?10:f.st==='death'?9:14;let fr=Math.floor(f.t*fps);
 if(busy(f)){if(f.st.startsWith('attack')&&!f.hitDone&&fr>=Math.floor(an[f.st]*.5)){f.hitDone=true;hit(f,o)}
  if(fr>=an[f.st]){if(f.st==='death')fr=an.death-1;else{setSt(f,'idle');fr=0}}}
 else setSt(f,f.y<0?(f.vy<0?'jump':'fall'):mv&&!f.blk?'run':'idle');
 f.fr=busy(f)||f.st==='death'?Math.min(fr,an[f.st]-1):fr%an[f.st]}
function draw(f){const s=SPR[f.s],im=IMG[f.s+f.st],k=SC,bob=f.st==='idle'?Math.sin(performance.now()/260)*k*.6:0;
 cx.save();cx.translate(f.x,G+f.y+bob);
 cx.fillStyle='#0008';cx.beginPath();cx.ellipse(0,-f.y-bob,k*16*(1+f.y/(k*200)),k*3.5,0,0,7);cx.fill();
 cx.scale(f.dir*k,k);
 if(f.hitT>0)cx.filter='brightness(2.6) saturate(0)';else if(f.stun>0)cx.filter='brightness(.7) sepia(1)';else if(f.buff>0)cx.filter='drop-shadow(0 0 3px #9b6bff)';else if(f.poison>0)cx.filter='hue-rotate(60deg)';
 cx.drawImage(im,f.fr*s.cell,0,s.cell,s.cell,-s.cx,-s.feet,s.cell,s.cell);cx.filter='none';
 if(f.blk){cx.strokeStyle='#9fd0ffcc';cx.lineWidth=2;cx.beginPath();cx.arc(10,-26,20,-1.2,1.2);cx.stroke();cx.fillStyle='#5aa6e822';cx.fill()}
 if(f.shield>0){cx.strokeStyle='#5aa6e888';cx.lineWidth=1.2;cx.beginPath();cx.ellipse(0,-26,22,30,0,0,7);cx.stroke()}
 cx.restore();if(f.stun>0){cx.fillStyle='#ffd86b';cx.font=`${k*8}px serif`;cx.textAlign='center';cx.fillText('✦ ✦',f.x+Math.sin(performance.now()/120)*k*3,G+f.y-SC*56)}}
function scene(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b0d34');g.addColorStop(1,'#0d0620');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(bg.complete&&bg.naturalWidth){const r=Math.max(W/bg.width,G/bg.height);cx.globalAlpha=.75;cx.drawImage(bg,(W-bg.width*r)/2,G-bg.height*r*.92,bg.width*r,bg.height*r);cx.globalAlpha=1}
 const v=cx.createRadialGradient(W/2,G*.6,G*.2,W/2,G*.6,Math.max(W,H)*.8);v.addColorStop(0,'#0000');v.addColorStop(1,'#0d0620ee');cx.fillStyle=v;cx.fillRect(0,0,W,H);
 const fl=cx.createLinearGradient(0,G,0,H);fl.addColorStop(0,'#3a2458');fl.addColorStop(.05,'#22123a');fl.addColorStop(1,'#08040f');cx.fillStyle=fl;cx.fillRect(0,G,W,H-G);
 cx.strokeStyle='#d9b25a66';cx.lineWidth=2;cx.beginPath();cx.moveTo(0,G);cx.lineTo(W,G);cx.stroke();
 cx.strokeStyle='#d9b25a1c';cx.lineWidth=1;for(let i=-10;i<=10;i++){cx.beginPath();cx.moveTo(W/2+i*W*.06,G);cx.lineTo(W/2+i*W*.25,H);cx.stroke()}
 for(let i=0;i<14;i++){const t=performance.now()/1000+i*7.3,x=(i*97.3%1)*W+((i*53)%W),y=G-((t*20+i*60)%G);cx.fillStyle=`rgba(255,${150+i*5},90,${.25+.2*Math.sin(t*3)})`;cx.fillRect(x%W,y,2,2)}}
function frame(now){requestAnimationFrame(frame);if(!P)return;let dt=Math.min(.05,(now-last)/1000||0);last=now;if(slow>0){slow-=dt;dt*=.25}
 if(!over){T=Math.max(0,T-dt);if(T===0){end()}}
 const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mv=over?0:(kx||inp.x),blk=!over&&(keys.s||keys.l||keys.arrowdown||inp.y===1||inp.blk);
 if(!over){if(inp.jump&&P.y===0&&!busy(P)&&P.stun<=0)P.vy=-SC*10;if(inp.atk)attack(P,false);if(inp.hvy)attack(P,true);if(inp.a1)ability(P,0);if(inp.a2)ability(P,1)}
 inp.jump=inp.atk=inp.hvy=inp.a1=inp.a2=0;
