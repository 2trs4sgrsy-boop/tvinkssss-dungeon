<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TVINKSSSS — Арена 1×1</title>
<style>
:root{--bg:#0d0620;--pan:rgba(42,18,80,.55);--gold:#d9b25a;--pur:#9b6bff;--red:#d8434b;--grn:#52c27a;--txt:#efe8ff;--mut:#a597c4;
--b:clamp(46px,min(13vw,14vh),86px);--h:100dvh}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:var(--h);overflow:hidden;background:var(--bg);color:var(--txt);font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{position:fixed;inset:0;height:var(--h);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:6px 10px;background:linear-gradient(#1b0d34,#0d0620cc);border-bottom:1px solid #d9b25a55;z-index:3}
.pl{display:flex;align-items:center;gap:7px;min-width:0}.pl.r{flex-direction:row-reverse;text-align:right}
.av{flex:none;width:clamp(30px,6vh,46px);aspect-ratio:1;border-radius:10px;border:2px solid var(--gold);background:#2a1450 center 12%/auto 180% no-repeat;box-shadow:0 0 10px #9b6bff66}
.info{flex:1;min-width:0}.nm{font-size:clamp(11px,1.9vh,15px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mut);font-weight:500}
.bar{height:clamp(9px,1.7vh,14px);margin-top:3px;border-radius:7px;background:#000a;border:1px solid #d9b25a88;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ff7a7a,var(--red));transition:width .15s}.bar b{position:absolute;inset:0 auto 0 0;background:#fff8;transition:width .6s .25s}
.r .bar i,.r .bar b{left:auto;right:0}
.sh{height:4px;margin-top:2px;border-radius:2px;background:#5aa6e8;width:0;transition:width .2s}.r .sh{margin-left:auto}
#tm{font:800 clamp(20px,4vh,32px)/1 Georgia,serif;color:var(--gold);text-shadow:0 0 10px #d9b25a88;min-width:2.2em;text-align:center}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#joy{position:absolute;left:max(12px,2vw);bottom:max(12px,2vh);width:calc(var(--b)*2.3);height:calc(var(--b)*2.3);border-radius:50%;background:radial-gradient(#2a145088,#0d062088);border:2px solid #d9b25a66;z-index:2}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d58a,#9b6bff);box-shadow:0 0 14px #9b6bff;pointer-events:none}
#joy span{position:absolute;color:#d9b25a99;font-size:calc(var(--b)*.22)}
#btns{position:absolute;right:max(12px,2vw);bottom:max(12px,2vh);display:grid;grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(2,var(--b));gap:calc(var(--b)*.14);z-index:2}
.bt{position:relative;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 30%,#4a2690,#1a0c33);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:calc(var(--b)*.36);overflow:hidden;box-shadow:0 3px 0 #0008,0 0 10px #9b6bff55}
.bt small{font-size:calc(var(--b)*.14);color:var(--mut);margin-top:1px}
.bt.on{transform:scale(.92);filter:brightness(1.4)}
.bt .cd{position:absolute;inset:0;background:conic-gradient(#000b var(--p,0%),transparent 0);display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.3);color:#fff}
.bt.big{grid-row:span 2;grid-column:3;border-radius:calc(var(--b)*.5);background:radial-gradient(circle at 40% 30%,#c0444b,#4a0c1a)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0d0620cc;z-index:5}
#ov h1{margin:0;font:800 clamp(28px,7vmin,56px) Georgia,serif;color:var(--gold);text-shadow:0 0 20px #d9b25a}
#ov button{font:700 18px system-ui;padding:12px 28px;border-radius:14px;border:2px solid var(--gold);background:var(--pur);color:#fff}
#msg{position:absolute;left:0;right:0;top:18%;text-align:center;font:800 clamp(22px,6vmin,48px) Georgia,serif;color:var(--gold);text-shadow:0 0 16px #000;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
#hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap;z-index:2;pointer-events:none}
@media (hover:none){#hint{display:none}}

#sel{position:fixed;inset:0;height:var(--h);z-index:10;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);padding:clamp(8px,1.8vh,18px) clamp(8px,2vw,24px);background:radial-gradient(ellipse at 50% 0,#3a1a6a,#0d0620 70%)}
#sel h2{margin:0;text-align:center;font:800 clamp(17px,3.4vh,30px) Georgia,serif;color:var(--gold);text-shadow:0 0 12px #d9b25a66}
.cols{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:clamp(6px,1.4vh,14px)}
@media (min-aspect-ratio:5/4){.cols{grid-template-rows:none;grid-template-columns:1fr 1fr}}
.side{min-height:0;display:flex;flex-direction:column;gap:6px;background:var(--pan);border:1px solid #d9b25a55;border-radius:14px;padding:clamp(6px,1.2vh,12px)}
.side .t{display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,2vh,16px);color:var(--gold)}
.prev{flex:1;min-height:0;display:flex;gap:8px}
.prev canvas{position:static;flex:1;min-width:0;width:100%;height:100%;border-radius:10px;background:linear-gradient(#2a1450,#120828)}
.desc{flex:1.3;min-width:0;overflow:hidden;font-size:clamp(9px,1.55vh,13px);font-weight:500;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.desc b{color:var(--txt);font-size:clamp(12px,2.1vh,17px)}.desc i{font-style:normal;color:var(--txt)}
.cls{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.cb{height:clamp(34px,7.5vh,64px);width:100%;border-radius:10px;border:2px solid #d9b25a44;background:#1a0c33 center 12%/auto 170% no-repeat;position:relative;color:#fff;font-size:clamp(14px,2.6vh,22px);display:flex;align-items:center;justify-content:center;padding:0}
.cb.on{border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.cb span{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:700 clamp(8px,1.3vh,11px) system-ui;text-shadow:0 0 3px #000,0 0 3px #000}
.gd{display:flex;gap:4px}.gd button{font:700 12px system-ui;padding:3px 10px;border-radius:8px;border:1px solid #d9b25a66;background:#1a0c33;color:var(--txt)}
.gd button.on{background:var(--pur);border-color:var(--gold)}.gd button:disabled{opacity:.3}
#go{flex:none;align-self:center;font:800 clamp(15px,2.8vh,22px) system-ui;padding:clamp(7px,1.5vh,14px) 48px;border-radius:14px;border:2px solid var(--gold);background:linear-gradient(#c0444b,#6a1020);color:#fff}
.bt em{font-style:normal}.bt small{max-width:92%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (max-height:480px) and (max-aspect-ratio:5/4){.desc .stl{display:none}#sel h2{font-size:15px}}
</style></head><body><div id="app"><div id="sel"><h2>⚔️ Арена 1×1 — выбор героя</h2><div class="cols">
 <div class="side"><div class="t">Ты<div class="gd" data-s="0"><button data-g="m">♂ М</button><button data-g="f">♀ Ж</button></div></div><div class="prev"><canvas id="pv0"></canvas><div class="desc" id="ds0"></div></div><div class="cls" data-s="0"></div></div>
 <div class="side"><div class="t">Соперник (ИИ)<div class="gd" data-s="1"><button data-g="m">♂ М</button><button data-g="f">♀ Ж</button></div></div><div class="prev"><canvas id="pv1"></canvas><div class="desc" id="ds1"></div></div><div class="cls" data-s="1"></div></div>
</div><button id="go">В бой!</button></div>
<div id="hud">
 <div class="pl"><div class="av" id="av0"></div><div class="info"><div class="nm" id="n0">Миша</div><div class="bar"><b id="hb0"></b><i id="h0"></i></div><div class="sh" id="s0"></div></div></div>
 <div id="tm">99</div>
 <div class="pl r"><div class="av" id="av1"></div><div class="info"><div class="nm" id="n1">ИИ</div><div class="bar"><b id="hb1"></b><i id="h1"></i></div><div class="sh" id="s1"></div></div></div>
</div>
<div id="stage"><canvas id="cv"></canvas>
 <div id="hint">A/D — ход · W — прыжок · S/L — блок · J — удар · K — сильный · U/I — умения</div>
 <div id="msg"></div>
 <div id="joy"><span style="left:50%;top:4%;transform:translateX(-50%)">▲</span><span style="left:50%;bottom:4%;transform:translateX(-50%)">🛡</span><span style="left:5%;top:50%;transform:translateY(-50%)">◀</span><span style="right:5%;top:50%;transform:translateY(-50%)">▶</span><div id="knob"></div></div>
 <div id="btns">
  <div class="bt" data-k="a1"><em id="i1">📯</em><small id="l1">Умение</small><div class="cd"></div></div>
  <div class="bt" data-k="a2"><em id="i2">🔨</em><small id="l2">Умение</small><div class="cd"></div></div>
  <div class="bt big" data-k="atk">⚔️<small>Удар</small></div>
  <div class="bt" data-k="blk">🛡️<small>Блок</small></div>
  <div class="bt" data-k="hvy">💥<small>Сильный</small><div class="cd"></div></div>
 </div>
 <div id="ov"><h1 id="res">Победа</h1><div style="display:flex;gap:10px"><button id="again">Реванш</button><button id="tosel">Герои</button></div></div>
</div></div>
<script>'use strict';
const A='assets/',$=id=>document.getElementById(id);
const setH=()=>document.documentElement.style.setProperty('--h',(window.Telegram?.WebApp?.viewportStableHeight||innerHeight)+'px');addEventListener('resize',setH);setH();
const SPR={"warrior": {"anim": {"idle": 11, "run": 8, "jump": 3, "fall": 3, "attack1": 7, "attack2": 7, "takehit": 4, "death": 11}, "cell": 180, "cx": 96, "feet": 114, "body": 51}, "assassin": {"anim": {"idle": 4, "run": 8, "jump": 2, "fall": 2, "attack1": 4, "attack2": 4, "takehit": 3, "death": 7}, "cell": 200, "cx": 97, "feet": 128, "body": 56}, "berserker": {"anim": {"idle": 10, "run": 8, "jump": 3, "fall": 3, "attack1": 7, "attack2": 9, "takehit": 3, "death": 11}, "cell": 126, "cx": 68, "feet": 82, "body": 41}, "archer": {"anim": {"idle": 10, "run": 8, "jump": 2, "fall": 2, "attack1": 6, "attack2": 6, "takehit": 3, "death": 10}, "cell": 100, "cx": 51, "feet": 67, "body": 36}, "paladin": {"anim": {"idle": 8, "run": 8, "jump": 2, "fall": 2, "attack1": 4, "attack2": 4, "takehit": 4, "death": 6}, "cell": 111, "cw": 160, "cx": 81, "feet": 105, "body": 54}};
const IMG={};for(const s in SPR)for(const a in SPR[s].anim){const im=new Image();im.src=`${A}sp/${s}_${a}.webp`;IMG[s+a]=im}
const ARROW=new Image();ARROW.src=A+'sp/arrow.webp';const bg=new Image();bg.src=A+'bg.webp';
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,G=0,SC=1,DPR=1;
function resize(){const r=$('stage').getBoundingClientRect();if(!r.width)return;DPR=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;
 const portrait=H>W*0.9,ctrl=$('btns').getBoundingClientRect();G=portrait?Math.min(H*0.86,ctrl.top-r.top-10):H*0.9;SC=Math.max(1.2,Math.min(G*0.3,W*(portrait?0.26:0.15))/52)}
addEventListener('resize',()=>{resize();drawPrev()});
// Классы: имена и суть умений — из dungeon engine.js CLASSES, числа адаптированы под PvP
const CLS={
 warrior:{name:'Воин',hp:165,dmg:1.15,spd:1,armor:.2,crit:.08,g:['m'],pass:'Бастион: блок режет 85% урона',
  ab:[{id:'rally',s:'Клич',n:'Боевой клич',i:'📯',cd:12,d:'щит +35'},{id:'crush',s:'Сокруш.',n:'Сокрушающий удар',i:'🔨',cd:15,d:'пробивает блок, оглушение 1.5 с'}]},
 berserker:{name:'Берсерк',hp:140,dmg:1.3,spd:1.05,armor:.05,crit:.1,g:['m'],pass:'Кровавая ярость: меньше HP — больше урон (до +50%)',
  ab:[{id:'frenzy',s:'Безумие',n:'Безумие',i:'🩸',cd:14,d:'6 с урон ×1.6; цена 8% HP'},{id:'whirl',s:'Вихрь',n:'Вихрь',i:'🌪️',cd:12,d:'удар вокруг себя, отбрасывает'}]},
 archer:{name:'Лучник',hp:115,dmg:1.05,spd:1.1,armor:.05,crit:.22,g:['f'],ranged:1,pass:'Меткость: стреляет издалека, каждый 5-й выстрел двойной',
  ab:[{id:'volley',s:'Залп',n:'Пронзающий залп',i:'🎯',cd:11,d:'веер из 5 стрел'},{id:'frost',s:'Лёд',n:'Ледяная стрела',i:'❄️',cd:14,d:'замедляет врага на 5 с'}]},
 assassin:{name:'Ассасин',hp:120,dmg:1.25,spd:1.3,armor:0,crit:.3,g:['m'],pass:'Тень: 12% уклонения',
  ab:[{id:'shadow',s:'Тень',n:'Удар из тени',i:'🌀',cd:10,d:'телепорт за спину, 4 с всё — крит'},{id:'poison',s:'Яд',n:'Отравленный клинок',i:'🧪',cd:13,d:'яд: 8% HP за 5 с'}]},
 paladin:{name:'Паладин',hp:150,dmg:1.05,spd:.95,armor:.15,crit:.08,g:['m'],pass:'Свет: удары лечат на 10% от урона',
  ab:[{id:'aegis',s:'Защита',n:'Божественная защита',i:'🌟',cd:18,d:'лечит 25% HP'},{id:'holy',s:'Св. щит',n:'Святой щит',i:'✝️',cd:20,d:'неуязвимость 2.5 с'}]}};
const ORDER=['warrior','berserker','archer','assassin','paladin'];
const pick=[{cls:'warrior',g:'m'},{cls:'random',g:'m'}];
const gOf=(c,g)=>CLS[c].g.includes(g)?g:CLS[c].g[0];
// ---------- select screen ----------
function buildSel(){for(const s of [0,1]){const box=document.querySelector(`.cls[data-s="${s}"]`);box.innerHTML='';
  const list=s?[...ORDER,'random']:ORDER;if(!s)box.style.gridTemplateColumns='repeat(5,1fr)';
  for(const c of list){const b=document.createElement('button');b.className='cb';b.dataset.c=c;
   if(c==='random'){b.textContent='🎲';b.innerHTML+='<span>Случайно</span>'}else{b.style.backgroundImage=`url(${A}av_${c}_${gOf(c,pick[s].g)}.webp)`;b.innerHTML=`<span>${CLS[c].name}</span>`}
   b.onclick=()=>{pick[s].cls=c;if(c!=='random')pick[s].g=gOf(c,pick[s].g);updSel()};box.appendChild(b)}}
 document.querySelectorAll('.gd button').forEach(b=>b.onclick=()=>{const s=+b.parentNode.dataset.s;pick[s].g=b.dataset.g;updSel()});updSel()}
function updSel(){for(const s of [0,1]){const p=pick[s];document.querySelectorAll(`.cls[data-s="${s}"] .cb`).forEach(b=>b.classList.toggle('on',b.dataset.c===p.cls));
  document.querySelectorAll(`.gd[data-s="${s}"] button`).forEach(b=>{const ok=p.cls==='random'||CLS[p.cls].g.includes(b.dataset.g);b.disabled=!ok;b.classList.toggle('on',p.cls!=='random'&&gOf(p.cls,p.g)===b.dataset.g)});
  const d=$('ds'+s);if(p.cls==='random'){d.innerHTML='<b>🎲 Случайный соперник</b><span>Класс выберется при старте боя</span>'}else{const c=CLS[p.cls],g=gOf(p.cls,p.g);
   d.innerHTML=`<b>${c.name} ${g==='f'?'♀':'♂'}</b><span class="stl">❤ ${c.hp} · ⚔ ×${c.dmg} · 🛡 ${Math.round(c.armor*100)}% · крит ${Math.round(c.crit*100)}%</span><span><i>Пассивка:</i> ${c.pass}</span>`+c.ab.map(a=>`<span>${a.i} <i>${a.n}</i> (${a.cd} с): ${a.d}</span>`).join('')+(c.g.length<2?`<span style="color:#d9b25a">Модель только ${c.g[0]==='m'?'мужская':'женская'}</span>`:'')}}drawPrev()}
let pvT=0;function drawPrev(){for(const s of [0,1]){const c=$('pv'+s);const r=c.getBoundingClientRect();if(!r.width)continue;const d=Math.min(2,devicePixelRatio||1);if(c.width!==Math.round(r.width*d)){c.width=r.width*d;c.height=r.height*d}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);g.imageSmoothingEnabled=false;let k=pick[s].cls;
  if(k==='random'){g.fillStyle='#d9b25a';g.font=`${Math.min(r.width,r.height)*.5}px serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('?',r.width/2,r.height/2);continue}
  const sp=SPR[k],im=IMG[k+'idle'],cw=sp.cw||sp.cell,sc=Math.min(r.height*.72,r.width*.9)/sp.body,fr=Math.floor(pvT*10)%sp.anim.idle;
  g.save();g.translate(r.width/2,r.height*.92);g.scale(s?-sc:sc,sc);if(im.complete)g.drawImage(im,fr*cw,0,cw,sp.cell,-sp.cx,-sp.feet,cw,sp.cell);g.restore()}}
$('go').onclick=()=>{$('sel').style.display='none';reset()};
$('tosel').onclick=()=>{$('ov').style.display='none';P=null;$('sel').style.display='flex';updSel()};
// ---------- fighters ----------
function mk(s,x,dir,g){const c=CLS[s];return{s,g,x,y:0,vy:0,dir,hp:c.hp,max:c.hp,st:'idle',t:0,fr:0,cd:{hvy:0,a1:0,a2:0},blk:false,shield:0,stun:0,hitT:0,kb:0,poison:0,buff:0,frenzy:0,slowT:0,inv:0,shots:0,hitDone:false,k:52/SPR[s].body,ai:{t:0}}}
let P=null,E,T,over,parts=[],floats=[],arrows=[],shake=0,last=0,slow=0;
function hudInit(){[P,E].forEach((f,i)=>{$('av'+i).style.backgroundImage=`url(${A}av_${f.s}_${f.g}.webp)`;$('n'+i).innerHTML=`${CLS[f.s].name} <small>· ${i?'ИИ':'ты'}</small>`});
 CLS[P.s].ab.forEach((a,i)=>{$('i'+(i+1)).textContent=a.i;$('l'+(i+1)).textContent=a.s})}
function reset(){resize();const o=pick[1].cls==='random'?ORDER[Math.random()*5|0]:pick[1].cls;P=mk(pick[0].cls,W*0.3,1,gOf(pick[0].cls,pick[0].g));E=mk(o,W*0.7,-1,gOf(o,pick[1].g));
 hudInit();T=99;over=false;parts=[];floats=[];arrows=[];$('ov').style.display='none';say('БОЙ!')}
function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>m.style.opacity=0,900)}
const busy=f=>['attack1','attack2','takehit','death'].includes(f.st);
function setSt(f,st){if(f.st!==st){f.st=st;f.t=0;f.hitDone=false}}
function attack(f,heavy){if(busy(f)||f.stun>0||f.hp<=0)return;if(heavy){if(f.cd.hvy>0)return;f.cd.hvy=1.6}setSt(f,heavy?'attack2':'attack1');f.heavy=heavy}
function ability(f,i){const o=f===P?E:P,a=CLS[f.s].ab[i],k='a'+(i+1),y=G+f.y-SC*28;if(f.cd[k]>0||f.hp<=0||f.stun>0||busy(f))return;f.cd[k]=a.cd;float(f,a.n,'#d9b25a');
 switch(a.id){
 case 'rally':f.shield=35;burst(f.x,y,'#5aa6e8',30);break;
 case 'crush':setSt(f,'attack2');f.heavy=true;f.crush=true;break;
 case 'frenzy':f.frenzy=6;f.hp=Math.max(1,f.hp-f.max*.08);burst(f.x,y,'#ff3a3a',30);break;
 case 'whirl':setSt(f,'attack2');f.heavy=true;f.whirl=true;break;
 case 'volley':for(let j=-2;j<=2;j++)shoot(f,{vy:j*SC*.9,dmg:5});setSt(f,'attack1');f.heavy=false;f.hitDone=true;break;
 case 'frost':shoot(f,{dmg:6,frost:true,c:'#9fe8ff'});setSt(f,'attack1');f.heavy=false;f.hitDone=true;break;
 case 'shadow':burst(f.x,y,'#9b6bff',25);f.x=Math.max(W*.05,Math.min(W*.95,o.x-o.dir*SC*26));f.dir=o.x>f.x?1:-1;burst(f.x,y,'#9b6bff',25);f.buff=4;break;
 case 'poison':setSt(f,'attack1');f.heavy=false;f.pois=true;break;
 case 'aegis':f.hp=Math.min(f.max,f.hp+f.max*.25);burst(f.x,y,'#ffe680',35);float(f,'+'+Math.round(f.max*.25),'#52c27a');break;

function shoot(f,o){arrows.push({x:f.x+f.dir*SC*14,y:G+f.y-SC*22,vx:f.dir*SC*7,vy:o.vy||0,from:f,dmg:o.dmg,frost:o.frost,c:o.c,l:1.6})}
function dmgCalc(a,base){let d=base*CLS[a.s].dmg*(1+Math.random()*.2);if(a.s==='berserker')d*=1+.5*(1-a.hp/a.max);if(a.frenzy>0)d*=1.6;const crit=a.buff>0||Math.random()<CLS[a.s].crit;if(crit)d*=a.buff>0?2:1.6;return[d,crit]}
function apply(a,d,dmg,crit,heavy,dir,fx){const front=Math.sign(a.x-d.x)===d.dir;
 if(d.inv>0){float(d,'Неуязвим','#fff6c0');return}

function melee(a,d){if(CLS[a.s].ranged){const n=++a.shots%5===0?2:1;for(let i=0;i<n;i++)setTimeout(()=>a.hp>0&&shoot(a,{dmg:a.heavy?11:5}),i*120);return}

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*v*SC/3,vy:Math.sin(a)*v*SC/3,l:.5+Math.random()*.4,c,r:SC*(.6+Math.random())})}}

function upd(f,o,mv,blk,dt){const c=CLS[f.s];for(const k in f.cd)f.cd[k]=Math.max(0,f.cd[k]-dt);for(const k of['buff','hitT','frenzy','slowT','inv'])f[k]=Math.max(0,f[k]-dt);

 if(f.stun>0){f.stun-=dt;mv=0;blk=false}
 f.blk=blk&&!busy(f)&&f.y===0&&f.hp>0;const sl=f.slowT>0?.55:1;

 if(!busy(f)&&f.hp>0)f.dir=o.x>f.x?1:-1;
 const an=SPR[f.s].anim;f.t+=dt;const fps=(f.st==='idle'?10:f.st==='death'?9:14)*(f.frenzy>0&&busy(f)?1.4:1)*sl;let fr=Math.floor(f.t*fps);

 else setSt(f,f.y<0?(f.vy<0?'jump':'fall'):mv&&!f.blk?'run':'idle');

function draw(f){const s=SPR[f.s],im=IMG[f.s+f.st],cw=s.cw||s.cell,k=SC*f.k,bob=f.st==='idle'?Math.sin(performance.now()/260)*SC*.5:0;

function scene(){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b0d34');g.addColorStop(1,'#0d0620');cx.fillStyle=g;cx.fillRect(0,0,W,H);

 for(let i=0;i<14;i++){const t=performance.now()/1000+i*7.3,x=(i*53)%W,y=G-((t*20+i*60)%G);cx.fillStyle=`rgba(255,${150+i*5},90,${.25+.2*Math.sin(t*3)})`;cx.fillRect(x,y,2,2)}}
function frame(now){requestAnimationFrame(frame);let dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(!P){pvT+=dt;if($('sel').style.display!=='none')drawPrev();return}
 if(slow>0){slow-=dt;dt*=.25}
 if(!over){T=Math.max(0,T-dt);if(T===0)end()}
